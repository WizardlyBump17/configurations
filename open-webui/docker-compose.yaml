services:
  open-webui:
    image: "ghcr.io/open-webui/open-webui:dev"
    volumes:
      - "open-webui:/app/backend/data"
    environment:
      HF_HUB_OFFLINE: "1"
      HOST: "0.0.0.0"
      PORT: "8080"
    ports:
      - "8081:8080"

  searxng:
    image: "docker.io/searxng/searxng:latest"
    volumes:
      - "./searxng/config/:/etc/searxng/"
      - "searxng:/var/cache/searxng/"
    ports:
      - "8082:8080"

volumes:
  open-webui:
  searxng:
